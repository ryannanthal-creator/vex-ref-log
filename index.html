<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121317">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ref Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>VEX Ref Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE work tool for a head referee at the field: fast, calm, no decoration
   IDEA the paper match anomaly log on a clipboard: ruled rows, alliance-coloured match cards, cited rule numbers
   PICTURE the live match list itself: red and blue alliance strips carrying violation pips for every team
   COLOUR white ground, near-black header band, alliance red #d0122f and blue #1d4ed8, minor amber #f5b000
   TYPE Barlow Condensed 700 for match and team numbers + Barlow for text
   LAYOUT dark band with event and tabs on top; one 960px working column; phone: same column, forms slide up as sheets */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#111215);--ink:light-dark(#16171b,#eceef2);--mut:light-dark(#585d69,#a3a9b5);--line:light-dark(#e3e5ea,#2b2e35);--line2:light-dark(#c6c9d1,#454952);--surf:light-dark(#f4f5f7,#1a1c21);--band:#121317;--red:light-dark(#d0122f,#ff5a6c);--blue:light-dark(#1d4ed8,#7aa3ff);--redt:light-dark(#fdebee,#33151a);--bluet:light-dark(#e8eefd,#142039);--amber:#f5b000;--warnbg:light-dark(#fff5d6,#2d2510);--warnink:light-dark(#6b4500,#ffd36b);--focus:light-dark(#1d4ed8,#9bbcff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{scroll-padding-top:140px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h2{font:700 26px/1.1 'Barlow Condensed',sans-serif;margin:0 0 8px;letter-spacing:-.01em}
h3{font:700 19px/1.2 'Barlow Condensed',sans-serif;margin:18px 0 6px}
.top{position:sticky;top:0;z-index:5;background:var(--band);color:#f1f2f5;padding:max(8px,env(safe-area-inset-top,0px)) max(16px,4vw,env(safe-area-inset-right,0px)) 0 max(16px,4vw,env(safe-area-inset-left,0px))}
button,a,label,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.bar{max-width:960px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"ev add" "sy add";column-gap:12px;align-items:center}
.evbtn{grid-area:ev;display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:none;border:0;padding:6px 0;text-align:left;min-height:48px;color:#fff}
.evbtn .n{font:700 clamp(24px,4vw,32px)/1.05 'Barlow Condensed',sans-serif;display:flex;align-items:center;gap:8px;max-width:100%}
.evbtn .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evbtn .m{font-size:14px;color:#b8bcc6}
.sync{grid-area:sy;padding-bottom:4px;display:inline-flex;align-items:center;gap:7px;font-size:13px;color:#c9ccd4;white-space:nowrap}
.sync i{width:9px;height:9px;border-radius:50%;background:#e9ebef}
.sync.busy i{background:var(--amber)}
.sync.bad i{background:#ff5a6c}
.add{grid-area:add;background:var(--amber);color:#211800;border:0;border-radius:10px;font:700 17px/1 Barlow,sans-serif;padding:0 18px;min-height:44px}
.tabs{max-width:960px;margin:4px auto 0;display:flex;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;color:#b8bcc6;font:600 16px/1 Barlow,sans-serif;padding:12px 14px 11px;min-height:46px}
.tabs button[aria-selected=true]{color:#fff;border-bottom-color:var(--amber)}
.tabs svg{display:none;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fab{display:none}
main{max-width:960px;margin:0 auto;padding:16px max(16px,4vw) 96px}
.sample{margin:0 0 12px;font-size:14px;color:var(--mut)}
.start>h2{font-size:clamp(32px,7vw,44px);line-height:1.05;margin:8px 0 6px}
.start>.hint{font-size:16px;max-width:52ch;margin:0 0 8px}
.start .evbtn svg{display:none}
.noev .tabs,.noev .fab,.noev .add{display:none!important}
.actions .linkb{border:0!important;background:none!important;padding:0 4px!important;min-height:44px;font-weight:600}
details.adv summary{list-style:none;justify-content:space-between;border-top:1px solid var(--line)}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::after{content:'+';font-size:24px;font-weight:400;color:var(--mut)}
details.adv[open] summary::after{content:'–'}
.noev main{padding-bottom:48px}
.noev .evbtn svg{display:none}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.tools input[type=search]{flex:1 1 200px}
input,select,textarea{font-size:16px;padding:10px 12px;border:1px solid var(--line2);border-radius:9px;background:var(--bg);min-height:44px;width:100%}
textarea{resize:vertical;line-height:1.4}
.tools select{width:auto;flex:0 1 auto}
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:15px}
.opt{font-weight:400;color:var(--mut);font-size:14px}
.inl{flex-direction:row;align-items:center;gap:8px;font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--bg);border:0;border-right:1px solid var(--line2);padding:0 14px;min-height:42px;font-weight:600}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg.wide{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));width:100%}
.seg .b-red[aria-pressed=true]{background:var(--red);color:#fff}
.seg .b-blue[aria-pressed=true]{background:var(--blue);color:#fff}
.mrow,.trow{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--bg);overflow:hidden;scroll-margin-top:140px}
.mrow.open,.trow.open{border-color:var(--line2);box-shadow:0 2px 0 var(--line)}
.mhead{display:grid;grid-template-columns:4.6em minmax(0,1fr) minmax(0,1fr);width:100%;background:none;border:0;padding:0;text-align:left;min-height:66px}
.mlab{padding:10px 6px 10px 12px;display:flex;flex-direction:column;justify-content:center}
.mlab b{font:700 25px/1 'Barlow Condensed',sans-serif}
.mlab b{white-space:nowrap}
.mlab b.l1{font-size:20px}
.mlab b.l2{font-size:16px}
.mlab small{font-size:13px;color:var(--mut);white-space:nowrap}
.all{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px}
.ts{display:flex;flex-direction:column;gap:3px;min-width:0}
.asc{font:700 30px/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center;min-width:1.6em}
.all.red .asc{color:var(--red)}
.all.blue .asc{color:var(--blue)}
.all.won .asc::after{content:'';display:block;height:4px;border-radius:2px;background:currentColor;margin-top:4px}
.all.lost .asc{opacity:.45}
.result{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font:700 24px/1.1 'Barlow Condensed',sans-serif}
.result .red{color:var(--red)}
.result .blue{color:var(--blue)}
.result button{font:600 15px Barlow,sans-serif}
.result .muted{font:500 16px Barlow,sans-serif;color:var(--mut)}
.chip.rW{border-color:var(--ink)}
.chip.rW small{color:var(--ink);font-weight:700}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px}
.sw.red{background:var(--red)}
.sw.blue{background:var(--blue)}
.all.red{background:var(--redt);border-left:4px solid var(--red)}
.all.blue{background:var(--bluet);border-left:4px solid var(--blue)}
.all.tw{grid-column:span 2;background:var(--surf);border-left:4px solid var(--ink)}
.all.tw .ts{flex-direction:row;flex-wrap:wrap;column-gap:18px}
.all.tw .asc{color:var(--ink)}
.tchip{display:flex;align-items:center;gap:6px;font:600 18px/1.15 'Barlow Condensed',sans-serif;white-space:nowrap}
.tbd{color:var(--mut)}
.pips{display:inline-flex;gap:3px;align-items:center}
.pips em{font:600 13px Barlow,sans-serif;font-style:normal;color:var(--mut)}
.pip{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 1.5px var(--bg)}
.pip.mj{border-radius:2px;background:var(--red)}
.pip.ds{width:13px;border-radius:2px;background:repeating-linear-gradient(135deg,#16171b 0 3px,var(--amber) 3px 6px)}
.mdet,.tdet{padding:12px;border-top:1px solid var(--line);display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.tdet{display:block}
.tb{border-radius:10px;padding:12px;background:var(--surf);border-top:4px solid var(--red)}
.tb.blue{border-top-color:var(--blue)}
.tb.tw,.tb.auton{border-top-color:var(--ink)}
.tbh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tlink{background:none;border:0;padding:0;text-align:left;display:flex;align-items:baseline;gap:8px;min-height:36px}
.tlink b,.tn b{font:700 26px/1 'Barlow Condensed',sans-serif}
.tlink span,.tn small{color:var(--mut);font-size:14px}
.tlink:hover b{text-decoration:underline}
.tsum{font-size:14px;color:var(--mut);white-space:nowrap}
.h{font:700 20px/1 'Barlow Condensed',sans-serif}
.lbl{font-weight:600;font-size:14px;margin:12px 0 6px}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.quick button{min-height:46px;border-radius:9px;border:1px solid var(--line2);background:var(--bg);font-weight:700;padding:0 4px}
.q-minor{background:var(--amber)!important;color:#211800;border-color:transparent!important}
.q-major{background:var(--red)!important;color:#fff;border-color:transparent!important}
.q-disabled{background:var(--ink)!important;color:var(--bg);border-color:transparent!important}
.tag{display:inline-block;font:700 13px/1 Barlow,sans-serif;padding:5px 8px;border-radius:5px;white-space:nowrap}
.t-minor{background:var(--amber);color:#211800}
.t-major{background:var(--red);color:#fff}
.t-disabled{background:var(--ink);color:var(--bg)}
.t-note{box-shadow:inset 0 0 0 1px var(--line2);color:var(--mut)}
.aff{font-size:13px;font-weight:700;color:var(--red);white-space:nowrap}
.rc{font:700 16px/1 'Barlow Condensed',sans-serif;white-space:nowrap}
.ent{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-top:8px}
.ent .l1{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.nt{font-size:15px}
.meta{font-size:13px;color:var(--mut)}
.warn{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--warnink);background:var(--warnbg);border-radius:8px;padding:8px 10px;margin-top:8px}
.warn svg{flex:none;margin-top:2px}
.warn small{display:block;opacity:.85}
.hint{font-size:14px;color:var(--mut);margin:6px 0}
.none{color:var(--mut)}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:24px;text-align:left}
.empty p{color:var(--mut);margin:4px 0 14px;max-width:52ch}
.primary,.ghost,.danger,.actions button,.empty button,.ffoot button{min-height:44px;border-radius:9px;border:1px solid var(--line2);background:var(--bg);padding:0 16px;font-weight:700}
.primary{background:var(--ink)!important;color:var(--bg)!important;border-color:var(--ink)!important}
.danger{color:var(--red)!important;border-color:color-mix(in srgb,var(--red) 50%,transparent)!important}
.danger.solid{background:var(--red)!important;color:#fff!important}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.sp{flex:1}
.thead{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;padding:12px;text-align:left;min-height:60px}
.tn{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.wdot{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--warnbg);color:var(--warnink);font-weight:700;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--bg);font:600 15px/1.2 Barlow,sans-serif;max-width:100%}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .lab{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:22ch}
.chip.static{min-height:36px;padding:2px 4px 2px 12px;cursor:default}
.chip.static b{font:700 17px 'Barlow Condensed',sans-serif}
.chip small{color:var(--mut)}
.x{background:none;border:0;min-width:36px;min-height:36px;border-radius:50%;color:var(--mut);font-size:18px}
.sum{margin:0 0 10px;color:var(--mut)}
.sum b{color:var(--ink);font:700 22px 'Barlow Condensed',sans-serif}
.log{border-top:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:4.6em 4.2em 5.4em 6.4em minmax(0,1fr);gap:4px 10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 4px;min-height:48px}
.lrow:hover{background:var(--surf)}
.lt{font-size:14px;color:var(--mut);white-space:nowrap}
.lm,.lteam{font:700 18px/1.1 'Barlow Condensed',sans-serif;white-space:nowrap}
.lx{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.pinfo{margin:0 0 12px;font-size:15px}
.rsec h3{border-bottom:2px solid var(--ink);padding-bottom:4px}
.rrow{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:5em minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 4px;min-height:44px}
.rrow a{font-size:14px;white-space:nowrap}
.cnt{border:0;background:var(--warnbg);color:var(--warnink);border-radius:999px;padding:4px 10px;font-weight:700;font-size:14px;min-height:32px}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.count{font:600 18px Barlow,sans-serif;color:var(--mut)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.grid2 .actions{grid-column:1/-1;margin-top:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row .grow{flex:1 1 220px}
.ex{background:var(--surf);border-radius:8px;padding:8px 10px;font:500 14px/1.4 ui-monospace,monospace;overflow-x:auto;margin:6px 0 8px}
.sheet{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);z-index:20;background:rgb(0 0 0/.5);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.card2{position:relative;background:var(--bg);color:var(--ink);width:min(640px,100%);max-height:94%;overflow:auto;overscroll-behavior:contain;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sx{position:absolute;top:10px;right:10px;z-index:2;width:44px;height:44px;border-radius:50%;border:0;background:var(--surf);color:var(--ink);font-size:24px;line-height:1}
.card2>h2:first-of-type{padding-right:48px}
.card2.full{padding:0}
.fhead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 12px 10px 16px}
.fhead h2{margin:0;flex:1}
.fhead .sx{position:static;flex:none}
.fbody{padding:4px 16px 16px}
.card2.full>form{min-height:100%;display:flex;flex-direction:column}
.card2.full .fbody{flex:1}
.sheet:not([hidden])~.toast{top:calc(env(safe-area-inset-top,0px) + 12px);bottom:auto!important}
.ffoot{position:sticky;bottom:0;z-index:2;display:flex;gap:8px;align-items:center;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.ffoot .primary{flex:1;max-width:260px;min-height:50px;font-size:17px}
.ffoot button{min-height:50px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.lt2{display:flex;gap:6px;align-items:baseline}
.byline{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:15px;color:var(--mut);margin-top:12px}
.byline b{color:var(--ink)}
.card2 h2:focus{outline:none}
.card2 form>label,.card2>label{margin-top:12px}
.outs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;border:0;padding:0;margin:14px 0 6px}
.outs legend{font-weight:600;font-size:15px;margin-bottom:6px;padding:0}
.outs label{position:relative;font-size:16px}
.outs input{position:absolute;opacity:0;inset:0;margin:0}
.outs span{display:flex;min-height:46px;align-items:center;justify-content:center;border:1px solid var(--line2);border-radius:9px;font-weight:700}
.outs input:checked+.o-minor{background:var(--amber);color:#211800;border-color:var(--amber)}
.outs input:checked+.o-major{background:var(--red);color:#fff;border-color:var(--red)}
.outs input:checked+.o-disabled,.outs input:checked+.o-note{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.outs input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.chk{flex-direction:row;align-items:center;gap:10px;font-weight:500;min-height:44px}
.chk input{width:22px;height:22px;min-height:0}
.ctx{font-size:15px;background:var(--surf);border-radius:9px;padding:9px 11px;margin-top:10px}
.ctx:empty{display:none}
.ctx .new{font-size:13px;color:var(--mut)}
#fPicks{margin-top:6px}
#fSel:empty{display:none}
#fRuleQ{margin-top:8px}
.rres .rr{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.rres .rr>button:first-child{flex:1;border-bottom:0}
.rres .rd{flex:none;background:none;border:0;border-left:1px solid var(--line);color:var(--blue);font-weight:600;padding:0 14px;min-height:44px}
.rres button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:10px 6px;border:0;border-bottom:1px solid var(--line);background:none;min-height:44px}
.err{color:var(--red);font-weight:600;margin:8px 0 0}
.err:empty{display:none}
.evlist{display:grid;gap:6px;margin:8px 0 6px}
.evitem{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;min-height:56px}
.evitem b{font:700 20px/1.1 'Barlow Condensed',sans-serif}
.evitem span{font-size:14px;color:var(--mut)}
.evitem.cur{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--amber)}
.where{border:0;padding:0;margin:0;grid-column:1/-1;display:grid;gap:6px}
.where legend{font-weight:600;font-size:15px;margin-bottom:4px;padding:0}
.rad{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rad input{width:20px;height:20px;min-height:0;margin-top:2px;flex:none}
.rad b{display:block}
.filebtn{display:inline-flex;margin-top:8px}
.reev{display:flex;flex-direction:column;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;padding:10px 12px;margin:12px 0}
.reev b{font:700 21px/1.15 'Barlow Condensed',sans-serif}
.reev span{font-size:14px;color:var(--mut)}
.linkb{background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;font:inherit}
.note{background:var(--surf);border-radius:9px;padding:9px 11px;font-size:14px;margin:8px 0}
details.adv{margin-top:14px}
details.adv summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.grp{font-weight:700;font-size:14px;color:var(--mut);margin:14px 0 2px}
.divs{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px 12px}

<script>
{
const $=s=>document.querySelector(s);

/* Rule codes with short paraphrased labels. The game manual's own wording governs. */
const V5R=[
['Safety','S1 Operate safely; unsafe Robots can be disabled|S2 Students need adult supervision|S3 Release form on file for every Student|S4 Robots stay inside the Field|S5 Wear safety glasses'],

['Specific game','SG1 Starting a Match|SG2 Horizontal expansion limit|SG3 Vertical expansion limit|SG4 Keep Scoring Objects in the Field|SG5 Preloads|SG6 Possess at most one Pin and one Cup|SG7 The Autonomous Line|SG8 Midfield and Autonomous Line in Autonomous|SG9 Alliance Goals are protected|SG10 Don’t remove Placed objects from neutral or opposing Goals|SG11 Introducing Match Loads|SG12 Endgame restrictions|SG13 Load Zone protections'],

['Tournament','T1 Head Referee has final say and keeps the anomaly log|T2 Head Referee qualifications|T3 Drive Team appeals|T4 Event Partner authority|T5 Field and object variance|T6 Field repairs and modifications|T7 Fields consistent at an event|T8 Field control systems|T9 Field Perimeter types|T10 Qualification schedule|T11 Minimum Qualification Matches|T12 Qualification rankings|T13 Ranking tiebreakers|T14 Number of Elimination Alliances|T15 Student at Alliance Selection|T16 Alliance invitations|T17 Elimination bracket|T18 Best-of-1 and best-of-3|T19 Ties and rematches in Eliminations|T20 Skills Match schedule|T21 Skills Field requirements|T22 Event Skills rankings|T23 Global Skills rankings|T24 League Skills']];

['VEX U robot','VUR1 Two Robots: sizes and materials|VUR2 Allowed VEX products|VUR3 Fabrication processes|VUR4 Raw Stock forms|VUR5 What isn’t Raw Stock|VUR6 Prohibited materials|VUR7 Fabricated Parts are Team-made|VUR8 Springs|VUR9 Fasteners|VUR10 V5 Brain and Radio|VUR11 Motor limits|VUR12 Sensors and processors|VUR13 No commercial electromechanical assemblies|VUR14 Pneumatics|VUR15 Bearings']];

['Scoring','SC1 Scores checked after the Match|SC2 Head Referee checks visually|SC3 Floor Goal|SC4 L1, L2 and L3 Goals|SC5 L4 Goal'],
['Specific game','SG1 Starting a Match|SG2 Horizontal expansion limit|SG3 Vertical expansion is unlimited|SG4 Keep Scoring Objects in the Field|SG5 One yellow Bean Bag Preload|SG6 Possess at most one Bean Bag|SG7 Using the Load Zone'],
['Robot Skills','RSC1 Standard rules mostly apply|RSC2 Scoring Skills Matches|RSC3 Skills Robot and Field setup|RSC4 Loader and Driver differences|RSC5 Handling Robots in Autonomous Coding|RSC6 Starting an Autonomous Coding Match|RSC7 No humans in Autonomous Coding|RSC8 Skills Stop Time'],
['Robot','R1 One Robot per Team|R2 Must pass inspection|R3 Size limit|R4 License plates|R5 Let go after the Match|R6 One Brain|R7 Power button reachable|R8 Firmware|R9 Motor limit|R10 Batteries|R11 One Controller per Robot|R12 Built from VEX IQ|R13 Prohibited items|R14 Allowed non-VEX IQ items|R15 Decorations|R16 Pneumatics|R17 Modifying parts'],
['Tournament','T1 Head Referee has final say and keeps the anomaly log|T2 Head Referee qualifications|T3 Appeals|T4 Event Partner authority|T5 Minor Field variance|T6 Field repairs and modifications|T7 Fields consistent at an event|T8 Qualification schedule|T9 Qualification Matches per Team|T10 Ranking by average score|T11 Ranking tiebreakers|T12 Alliance formation|T13 Teams in Finals|T14 Finals schedule|T15 Skills Match schedule|T16 Skills Field modifications|T17 Event Skills rankings|T18 Global Skills rankings|T19 League Skills']];
const mk=a=>a.flatMap(([sec,s])=>s.split('|').map(x=>{const i=x.indexOf(' ');return{code:x.slice(0,i),label:x.slice(i+1),sec}}));
const V5Q='https://events.vex.com/V5RC/2026-2027/QA/tag/',IQQ='https://events.vex.com/VIQRC/2026-2027/QA/tag/',VUQ='https://events.vex.com/VURC/2026-2027/QA/tag/';
const PROG={
 V5RC:{label:'V5RC',long:'VEX V5 Robotics Competition',game:'Override',red:2,blue:2,auton:true,manual:'https://www.vexrobotics.com/override-manual',qa:V5Q,rules:mk(V5R),picks:['SG6','SG2','SG9','SG10','SG11','SG13','GG17','GG4']},
 VURC:{label:'VEX U',long:'VEX U Robotics Competition',game:'Override',red:1,blue:1,auton:true,manual:'https://www.vexrobotics.com/override-manual',qa:VUQ,rules:mk(V5R).concat(mk(VUR)),picks:['SG6','SG2','SG9','SG10','SG13','VUG4','GG17','GG4']},
 VIQRC:{label:'VIQRC',long:'VEX IQ Robotics Competition',game:'Level Up',red:2,blue:0,auton:false,manual:'https://www.vexrobotics.com/level-up-manual',qa:IQQ,rules:mk(IQR),picks:['SG2','SG6','SG7','GG4','GG10','GG12','GG8','SG4']}};

const ruleMap=ev=>new Map(rulesFor(ev).map(r=>[r.code,r]));
const OUTS=['minor','major','disabled','note'],OL={minor:'Minor',major:'Major',disabled:'Disabled',note:'Note'};

/* ---------- storage ---------- */
const LS={ok:true,get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){this.ok=false;return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){this.ok=false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

const S={events:new Map(),entries:[],cur:prefs.cur||null,tab:prefs.tab||'matches',open:{match:null,team:null},mq:'',mround:'all',tq:'',tsort:'num',rq:'',f:{out:'all',rule:'',ref:'',q:'',sort:'new'},db:null,uid:null,dl:null,canWrite:true,pending:0,entPending:false,entStale:false,entErr:'',offline:typeof navigator!=='undefined'&&navigator.onLine===false,waitCloud:!!(prefs.cur&&prefs.curWhere&&prefs.curWhere!=='device'),boundKey:null,unsub:null,answered:{shared:false,mine:false},fb:null,fbUid:'',fbErr:'',people:[],unsubPeople:null};

function cleanEvent(d,id,where){d=d||{};const T=s=>str(s,10).toUpperCase().replace(/\s+/g,'');
 return{id,where,kind:'event',name:str(d.name,80)||'Untitled event',program:PROG[d.program]?d.program:'V5RC',sku:str(d.sku,40),date:str(d.date,10),sample:!!d.sample,
  teams:arr(d.teams).map(t=>({num:T(t&&t.num),name:str(t&&t.name,60),org:str(t&&t.org,80),city:str(t&&t.city,40),region:str(t&&t.region,40),robot:str(t&&t.robot,40),grade:str(t&&t.grade,24)})).filter(t=>t.num),
  matches:arr(d.matches).map(m=>({id:okSeg(m&&m.id)?m.id:uid(),label:str(m&&m.label,20).toUpperCase(),time:str(m&&m.time,12),red:arr(m&&m.red).map(T).filter(Boolean).slice(0,3),blue:arr(m&&m.blue).map(T).filter(Boolean).slice(0,3),sched:str(m&&m.sched,40),field:str(m&&m.field,20),scored:!!(m&&m.scored),rs:nn(m&&m.rs),bs:nn(m&&m.bs)})).filter(m=>m.label),
  customRules:arr(d.customRules).map(r=>({code:str(r&&r.code,12).toUpperCase(),label:str(r&&r.label,80)})).filter(r=>r.code),created:num(d.created),updated:num(d.updated),
  re:d.re&&typeof d.re==='object'&&num(d.re.id)?{id:num(d.re.id),div:num(d.re.div),divs:arr(d.re.divs).map(x=>({id:num(x&&x.id),name:str(x&&x.name,40)})).filter(x=>x.id).slice(0,40)}:null,
  info:d.info&&typeof d.info==='object'?{venue:str(d.info.venue,80),address:str(d.info.address,120),city:str(d.info.city,60),region:str(d.info.region,60),country:str(d.info.country,60),level:str(d.info.level,30),type:str(d.info.type,30),start:str(d.info.start,10),end:str(d.info.end,10)}:null}}
function cleanEntry(d,id){if(!d||!okSeg(id))return null;
 if(d.kind==='auton')return{id,kind:'auton',matchId:str(d.matchId,80),match:str(d.match,20),bonus:['red','blue','tie'].includes(d.bonus)?d.bonus:'',awpRed:!!d.awpRed,awpBlue:!!d.awpBlue,at:num(d.at)};
 const team=str(d.team,10).toUpperCase();if(!team)return null;
 return{id,kind:'entry',team,match:str(d.match,20).toUpperCase(),outcome:OUTS.includes(d.outcome)?d.outcome:'note',affecting:!!d.affecting,rules:arr(d.rules).map(r=>str(r,12).toUpperCase()).filter(Boolean).slice(0,8),notes:str(d.notes,600),ref:str(d.ref,40),at:num(d.at)}}
const evBody=ev=>({kind:'event',name:ev.name,program:ev.program,sku:ev.sku,date:ev.date,sample:ev.sample,teams:ev.teams,matches:ev.matches,customRules:ev.customRules,created:ev.created,updated:ev.updated,re:ev.re||null,info:ev.info||null});

 if(ev.where==='room')return `<section class="card"><h2>Live sharing</h2><p class="hint">Send the code or invite link to your other referees. Everyone who joins sees every entry as it’s logged.</p><div class="codebox"><span>Event code</span><b>${esc(fmtCode(ev.id))}</b></div><div class="actions"><button class="primary" data-act="copyLink">Copy invite link</button><button data-act="copyCode">Copy code</button></div><p class="hint" id="hereNow" role="status"></p><div class="actions"><button class="danger" data-act="leaveRoom">Leave on this device</button></div></section>`;
 return `<section class="card"><h2>Live sharing</h2><p class="hint">Share this event so other referees can join with a code and log into it from their own phones. Everyone sees each other’s entries live.</p><div class="actions"><button class="primary" data-act="shareEv"${S.fb?'':' disabled'}>Share this event</button></div>${S.fbErr?`<p class="err">Live sharing couldn’t start (${esc(S.fbErr)}). Check the Firebase setup in the README.</p>`:S.fb?'':'<p class="hint">Connecting to the sharing service…</p>'}</section>`}

/* ---------- install on home screen ---------- */
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(S.tab==='event'){shellKey='';renderAll()}});
addEventListener('appinstalled',()=>{installEvt=null;if(S.tab==='event'){shellKey='';renderAll()}});

function installCard(){if(inClaude||standalone())return'';const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 return `<section class="card"><h2>Put it on your home screen</h2><p class="hint">It opens full screen like an app, works with no signal, and updates itself whenever you’re online.</p>${installEvt?'<div class="actions"><button class="primary" data-act="install">Install app</button></div>':`<p class="hint">${ios?'In Safari, tap the Share button, then <b>Add to Home Screen</b>.':'Open your browser’s menu and choose <b>Install app</b> or <b>Add to Home Screen</b>.'}</p>`}</section>`}
if('serviceWorker' in navigator&&!inClaude&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)))addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});

/* ---------- official rule text ----------
   The wording belongs to VEX Robotics and is not stored in this app. Each rule is read
   from its official page on events.vex.com when opened, and a copy can be kept in this
   browser for offline use. */
const MANUAL={V5RC:'VEX_V5_Robotics_Competition_2026-2027_Override',VURC:'VEX_V5_Robotics_Competition_2026-2027_Override',VIQRC:'VEX_IQ_Robotics_Competition_2026-2027_Level_Up'};
const ruleBase=prog=>`https://events.vex.com/storage/game_manual/${MANUAL[prog]||MANUAL.V5RC}/rules/`;
const ruleUrl=(prog,code)=>ruleBase(prog)+encodeURIComponent(code)+'.html';
const ruleIndexUrl=prog=>ruleBase(prog)+'index.html';
const rkey=(prog,code)=>'rl.rule.'+(MANUAL[prog]||MANUAL.V5RC)+'.'+code;
const ruleCache=(prog,code)=>{const c=LS.get(rkey(prog,code),null);return c&&typeof c.h==='string'?c:null};
const DROP=new Set(['SCRIPT','STYLE','NOSCRIPT','IFRAME','OBJECT','EMBED','FORM','INPUT','BUTTON','SELECT','TEXTAREA','HEAD','TITLE','META','LINK','NAV','HEADER','FOOTER','SVG','CANVAS','VIDEO','AUDIO']);
const KEEP=new Set(['P','UL','OL','LI','B','STRONG','I','EM','BR','H1','H2','H3','H4','H5','TABLE','THEAD','TBODY','TR','TD','TH','IMG','A','SPAN','DIV','SUP','SUB','FIGURE','FIGCAPTION','BLOCKQUOTE','CODE','U','HR']);
const absUrl=(u,base)=>{try{const x=new URL(u,base);return x.protocol==='https:'?x.href:''}catch(e){return''}};
function cleanInto(src,dst,base){for(const n of src.childNodes){if(n.nodeType===3){dst.appendChild(document.createTextNode(n.textContent));continue}if(n.nodeType!==1||DROP.has(n.tagName))continue;
 if(!KEEP.has(n.tagName)){cleanInto(n,dst,base);continue}const el=document.createElement(n.tagName.toLowerCase());
 if(n.tagName==='A'&&/\/rules\/index\.html$/.test(absUrl(n.getAttribute('href')||'',base)))continue;
 if(n.tagName==='A'){const h=absUrl(n.getAttribute('href')||'',base),m=/\/rules\/([A-Za-z]{1,6}\d{1,3}[a-z]?)\.html/.exec(h);if(m){el.setAttribute('href',h);el.dataset.rule=m[1].toUpperCase()}else if(h){el.href=h;el.target='_blank';el.rel='noopener'}}
 if(n.tagName==='IMG'){const u=absUrl(n.getAttribute('src')||'',base);if(!u)continue;el.src=u;el.alt=n.getAttribute('alt')||'';el.loading='lazy'}
 if(n.tagName==='TD'||n.tagName==='TH'){const cs=+n.getAttribute('colspan');if(cs>1)el.colSpan=Math.min(cs,12)}
 const k=/(red|blue)/.exec((n.getAttribute('class')||'')+' '+(n.getAttribute('style')||''));if(k&&(n.tagName==='DIV'||n.tagName==='P'||n.tagName==='BLOCKQUOTE'))el.className='rk-'+k[1];
 cleanInto(n,el,base);dst.appendChild(el)}}
function mdInto(md,dst,base){md=md.replace(/^---[\s\S]*?\n---\s*/,'');let list=null;
 const inline=(t,el)=>{const re=/\*\*([^*]+)\*\*|\*([^*]+)\*|_([^_]+)_|\[([^\]]+)\]\(([^)\s]+)\)/g;let i=0,m;while((m=re.exec(t))){if(m.index>i)el.appendChild(document.createTextNode(t.slice(i,m.index)));let x;
  if(m[1])(x=document.createElement('strong')).textContent=m[1];else if(m[2]||m[3])(x=document.createElement('em')).textContent=m[2]||m[3];else{x=document.createElement('a');x.textContent=m[4];const h=absUrl(m[5],base),r=/\/rules\/([A-Za-z]{1,6}\d{1,3}[a-z]?)\.html/.exec(h);if(r){x.setAttribute('href',h);x.dataset.rule=r[1].toUpperCase()}else if(h){x.href=h;x.target='_blank';x.rel='noopener'}}el.appendChild(x);i=re.lastIndex}if(i<t.length)el.appendChild(document.createTextNode(t.slice(i)))};
 for(const raw of md.split(/\r?\n/)){const ln=raw.trimEnd();if(!ln.trim()){list=null;continue}let m;
  if((m=/^(#{1,4})\s+(.*)$/.exec(ln))){list=null;if(/rules\/index\.html/.test(m[2]))continue;const h=document.createElement('h'+Math.min(m[1].length,4));inline(m[2],h);dst.appendChild(h)}
  else if((m=/^\s*(?:[-*+]|\d+[.)]|[a-z][.)])\s+(.*)$/.exec(ln))){if(!list){list=document.createElement('ul');dst.appendChild(list)}const li=document.createElement('li');inline(m[1],li);list.appendChild(li)}
  else{list=null;if(/\]\([^)]*rules\/index\.html\)\s*$/.test(ln)&&!/[.;:]\s*\[/.test(ln))continue;const p=document.createElement('p');inline(ln.replace(/^>\s?/,''),p);dst.appendChild(p)}}}
function parseRule(text,base){const box=document.createElement('div');
 if(/<(html|body|h1|p|div)[\s>]/i.test(text)){const d=new DOMParser().parseFromString(text,'text/html');cleanInto(d.body,box,base)}else mdInto(text,box,base);
 return box.innerHTML.trim()}
const RELAY=(()=>{const c=window.REFLOG_CONFIG&&window.REFLOG_CONFIG.rulesRelay;return typeof c==='string'&&/^https:\/\//.test(c.trim())?c.trim().replace(/\/+$/,''):''})();
async function fetchRule(prog,code){const url=ruleUrl(prog,code),r=await fetch(RELAY?`${RELAY}/?path=${encodeURIComponent(new URL(url).pathname)}`:url,{mode:'cors',credentials:'omit'});if(r.status===404)throw Object.assign(new Error('missing'),{k:'missing'});if(!r.ok)throw new Error('http '+r.status);
 const h=parseRule(await r.text(),url);if(!h)throw new Error('empty');const c={h,at:Date.now()};LS.set(rkey(prog,code),c);pvMemo.delete(rkey(prog,code));return c}
const pvMemo=new Map();
function rulePreview(prog,code){const k=rkey(prog,code);if(pvMemo.has(k))return pvMemo.get(k);const c=ruleCache(prog,code);let t='';if(c){const d=document.createElement('div');d.innerHTML=c.h;d.querySelectorAll('h1').forEach(h=>h.remove());d.querySelectorAll('p,li,div,br,h2,h3,h4,td,th').forEach(el=>el.append(' '));t=d.textContent.replace(/\s+/g,' ').trim().slice(0,140)}pvMemo.set(k,t);return t}
function savedNote(prog){const n=PROG[prog].rules.filter(r=>ruleCache(prog,r.code)).length;return n?`${n} of ${PROG[prog].rules.length} saved on this device`:''}
const rvStack=[];
function openRule(code,o){o=o||{};const ev=curEv(),prog=ev?ev.program:'V5RC',r=(ev?ruleMap(ev):new Map()).get(code)||{code,label:''},v=$('#ruleView'),c=$('#rvCard'),n=ev?viol().filter(e=>e.rules.includes(code)).length:0;
 if(!o.back){if(!v.hidden&&c.dataset.code&&c.dataset.code!==code)rvStack.push(c.dataset.code);else if(v.hidden)rvStack.length=0}
 c.dataset.code=code;v._o=o;
 c.innerHTML=`<div class="fhead">${rvStack.length?'<button type="button" class="sx" data-rv="back" aria-label="Back">‹</button>':''}<h2 id="rvTitle" tabindex="-1">&lt;${esc(code)}&gt;</h2><button type="button" class="sx" data-rv="close" aria-label="Close">×</button></div>
  <div class="fbody">${r.label?`<p class="hint">${esc(r.label)}${r.custom?' · added for this event':''}</p>`:''}<div id="rvBody" class="rtext"><p class="hint">Loading the official wording…</p></div>
  ${n?`<p><button type="button" class="linkb" data-rv="log">${n} logged at this event · show in the log</button></p>`:''}${r.custom?'<p><button type="button" class="danger" data-rv="del">Remove this code from the event</button></p>':''}</div>
  <div class="ffoot">${o.onPick?`<button type="button" class="primary" data-rv="pick">${o.picked?'Remove from entry':'Add to entry'}</button>`:''}<a class="ext" href="${ruleUrl(prog,code)}" target="_blank" rel="noopener">Official page</a><a class="ext" href="${PROG[prog].qa}${encodeURIComponent(code)}" target="_blank" rel="noopener">Q&amp;A</a></div>`;
 v.hidden=false;document.body.style.overflow='hidden';c.scrollTop=0;$('#rvTitle').focus({preventScroll:true});
 const body=$('#rvBody'),show=(h,note)=>{body.innerHTML='';const t=document.createElement('div');t.innerHTML=h;const box=document.createElement('div');cleanInto(t,box,ruleUrl(prog,code));while(box.firstChild)body.appendChild(box.firstChild);const s=document.createElement('p');s.className='rsrc';s.textContent=note;body.appendChild(s)};
 const cached=ruleCache(prog,code);if(cached)show(cached.h,`Official wording from the ${PROG[prog].game} game manual on events.vex.com, saved ${ago(cached.at)}.`);
 if(inClaude){if(!cached)body.innerHTML='<p>This copy runs inside Claude, which can’t reach events.vex.com. Use <b>Official page</b> below, or open the app from your GitHub site.</p>';return}
 fetchRule(prog,code).then(f=>{if(c.dataset.code===code)show(f.h,`Official wording from the ${PROG[prog].game} game manual on events.vex.com, checked just now.`);if(S.tab==='rules')renderBody()})
  .catch(err=>{if(c.dataset.code!==code||cached)return;
   if(err&&err.k==='missing'){body.innerHTML=`<p>The game manual on events.vex.com has no page for &lt;${esc(code)}&gt;.${r.custom?' It was added by hand for this event.':' Check the rule number.'}</p>`;return}
   if(navigator.onLine===false){body.innerHTML='<p>You’re offline and this rule hasn’t been saved on this device yet. When you’re back online, tap <b>Save official rules for offline use</b> on the Rules tab.</p>';return}
   body.innerHTML=`<p>${RELAY?'The rules relay didn’t answer, so open this rule on VEX’s site instead.':'VEX’s site doesn’t let other apps show its rule pages, so open this rule there.'}</p><p><a class="bigbtn" href="${ruleUrl(prog,code)}" target="_blank" rel="noopener">Open &lt;${esc(code)}&gt; on events.vex.com</a></p>${RELAY?'':'<p class="rsrc">To read rules right here and save them for offline use, the site owner can turn on the free rules relay (see “Rules relay” in the README).</p>'}`})}
function closeRule(){$('#ruleView').hidden=true;$('#rvCard').innerHTML='';$('#rvCard').dataset.code='';rvStack.length=0;if($('#sheet').hidden)document.body.style.overflow=''}
$('#ruleView').addEventListener('click',e=>{if(e.target.id==='ruleView')return closeRule();const a=e.target.closest('a[data-rule]');if(a){e.preventDefault();openRule(a.dataset.rule);return}
 const b=e.target.closest('[data-rv]');if(!b)return;const k=b.dataset.rv,code=$('#rvCard').dataset.code,o=$('#ruleView')._o||{};
 if(k==='close')closeRule();else if(k==='back'){const prev=rvStack.pop();if(prev)openRule(prev,{back:true})}else if(k==='pick'){if(o.onPick)o.onPick();closeRule()}
 else if(k==='log'){closeRule();if(!$('#sheet').hidden)closeSheet();S.tab='log';S.f={out:'all',rule:code,ref:'',q:'',sort:'new'};prefs.tab='log';savePrefs();renderAll()}
 else if(k==='del'){const ev=curEv();if(!writable(ev))return;ev.customRules=ev.customRules.filter(r=>r.code!==code);persistEvent(ev);closeRule();toast(`Removed <${code}>`)}});
let savingRules=false;
async function saveRules(){const ev=curEv();if(!ev||savingRules||inClaude)return;savingRules=true;const prog=ev.program,L=PROG[prog].rules,note=t=>{const el=$('#rulesSaved');if(el)el.textContent=t};let ok=0,fail=0,first=true;
 for(let i=0;i<L.length;i+=4){const part=await Promise.all(L.slice(i,i+4).map(r=>fetchRule(prog,r.code).then(()=>1,e=>e&&e.k==='missing'?2:0)));ok+=part.filter(x=>x===1).length;fail+=part.filter(x=>x===0).length;
  if(first&&fail&&!ok){note(navigator.onLine===false?'You’re offline. Try again with a connection.':RELAY?'The rules relay didn’t answer. Try again later.':'VEX’s site doesn’t allow saving rules into the app yet. Tap a rule to open it on events.vex.com.');savingRules=false;return}first=false;note(`Saving… ${ok} of ${L.length}`)}
 savingRules=false;note(savedNote(prog)+(fail?` (${fail} couldn’t be reached)`:''));if(S.tab==='rules')renderBody()}

/* ---------- events wiring ---------- */
const A={
 tab:b=>{S.tab=b.dataset.tab;prefs.tab=S.tab;savePrefs();renderAll();window.scrollTo(0,0)},
 events:()=>{if(!curEv()&&!S.waitCloud){window.scrollTo(0,0);return}openEvents()},close:()=>closeSheet(),
 newBlank:()=>{const ev=curEv(),m=ev&&S.tab==='matches'&&ev.matches.find(x=>x.id===S.open.match);openEntry({match:m?m.label:'',team:S.tab==='teams'&&S.open.team||''})},
 openMatch:b=>{S.open.match=S.open.match===b.dataset.id?null:b.dataset.id;renderBody();if(S.open.match)jump('m-'+S.open.match)},
 openTeam:b=>{S.open.team=S.open.team===b.dataset.t?null:b.dataset.t;renderBody()},
 gotoTeam:b=>{S.tab='teams';S.tq='';S.open.team=b.dataset.t;shellKey='';renderAll();jump('t-'+b.dataset.t)},
 gotoMatch:b=>{S.tab='matches';S.mq='';S.mround='all';S.open.match=b.dataset.id;shellKey='';renderAll();jump('m-'+b.dataset.id)},
 new:b=>openEntry({team:b.dataset.t,match:b.dataset.m,outcome:b.dataset.o}),edit:b=>openEntry({id:b.dataset.id}),
 bonus:b=>setAuton(b.dataset.id,{bonus:b.dataset.k}),
 score:b=>openScore(b.dataset.id),
 awp:b=>{const ev=curEv(),m=ev.matches.find(x=>x.id===b.dataset.id);if(!m)return;const k=b.dataset.k==='red'?'awpRed':'awpBlue';setAuton(m.id,{[k]:!(autonFor(m)||{})[k]})},
 mround:b=>{S.mround=b.dataset.k;shellKey='';renderAll()},fout:b=>{S.f.out=b.dataset.k;shellKey='';renderAll()},
 rule:b=>openRule(b.dataset.k),saveRules:()=>saveRules(),
 ruleLog:b=>{S.tab='log';S.f={out:'all',rule:b.dataset.k,ref:'',q:'',sort:'new'};prefs.tab='log';savePrefs();renderAll()},
 export:b=>doExport(b.dataset.k),import:()=>openImport(),pickEv:b=>{setCur(b.dataset.id);closeSheet()},
 delRule:b=>{const ev=curEv();if(!writable(ev))return;ev.customRules=ev.customRules.filter(r=>r.code!==b.dataset.k);persistEvent(ev)},
 rmTeam:b=>{const ev=curEv();if(!writable(ev))return;ev.teams=ev.teams.filter(t=>t.num!==b.dataset.t);persistEvent(ev)},
 addTeams:()=>{const ev=curEv();if(!writable(ev))return toast('This event is view-only for you');const ta=$('#eTeams'),L=parseTeams(ta.value,ev.program);if(!L.length)return toast('No team numbers found');let n=0;
  for(const t of L){const x=ev.teams.find(y=>y.num===t.num);if(x){if(t.name)x.name=t.name}else{ev.teams.push(t);n++}}ta.value='';persistEvent(ev);toast(`Added ${n} team${n===1?'':'s'}`)},
 schedAdd:()=>sched(false),schedRep:()=>sched(true),
 install:async()=>{if(!installEvt)return;const e=installEvt;installEvt=null;e.prompt();try{await e.userChoice}catch(x){}shellKey='';renderAll()},
 reOpen:()=>openRE(),reUpdate:()=>reUpdate(),liveNow:()=>{const ev=curEv();if(ev&&liveOn(ev)){live(ev).done=0;renderBody();liveTick(true)}},
 shareEv:()=>shareEvent(),copyLink:()=>{const ev=curEv();if(ev&&ev.where==='room')copyText(inviteLink(ev.id),'Invite link')},copyCode:()=>{const ev=curEv();if(ev&&ev.where==='room')copyText(fmtCode(ev.id),'Event code')},
 leaveRoom:async()=>{const ev=curEv();if(!ev||ev.where!=='room')return;if(await ask('Leave this shared event?','It’s removed from this device only. Everyone else keeps it, and you can rejoin with the code.','Leave')){if(S.fb&&S.fbUid)S.fb.doc('rooms/'+ev.id+'/people/'+S.fbUid).delete().catch(()=>{});forgetRoom(ev.id);S.cur=null;S.waitCloud=false;rebuildEvents();shellKey='';renderAll();toast('Left the event')}},reForget:()=>{LS.del('rl.reToken');if(!$('#sheet').hidden)closeSheet();shellKey='';renderAll();toast('Token removed from this browser')},
 schedClr:async()=>{const ev=curEv();if(!writable(ev)||!ev.matches.length)return;if(await ask('Clear the schedule?','Matches are removed. Logged entries stay in the log.','Clear schedule')){ev.matches=[];persistEvent(ev)}},
 clearEntries:async()=>{const ev=curEv();if(!writable(ev))return;if(await ask('Delete all entries?',`Every entry in ${ev.name} is removed for everyone who can see this event.`,'Delete entries')){await clearEntries(ev);toast('All entries deleted')}},
 delEvent:async()=>{const ev=curEv();if(!writable(ev))return;if(await ask('Delete this event?',`${ev.name}, its schedule and every entry are removed.`,'Delete event'))deleteEvent(ev)}};
function sched(replace){const ev=curEv();if(!writable(ev))return toast('This event is view-only for you');const ta=$('#eSched'),L=parseSched(ta.value,ev.program),msg=$('#eSchedMsg');
 if(!L.length){msg.textContent='No matches found. Each line needs a match name and team numbers.';return}applySched(ev,L,replace);ta.value='';persistEvent(ev);msg.textContent=`${replace?'Schedule replaced':'Added or updated'}: ${L.length} match${L.length===1?'':'es'}. Check them in the Matches tab.`}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=A[b.dataset.act];if(f){e.preventDefault();f(b)}});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#ruleView').hidden)closeRule();else if(!$('#sheet').hidden)closeSheet()});
const IN={mq:v=>S.mq=v,tq:v=>S.tq=v,fq:v=>S.f.q=v,rq:v=>S.rq=v};
$('#main').addEventListener('input',e=>{const f=IN[e.target.id];if(f){f(e.target.value);renderBody()}});
$('#main').addEventListener('change',e=>{const id=e.target.id,v=e.target.value;if(id==='tsort'){S.tsort=v;renderBody()}else if(id==='mfield'){const ev=curEv();if(ev){prefs.mfield={...(prefs.mfield||{}),[ev.id]:v};savePrefs();renderBody()}}else if(id==='frule'){S.f.rule=v;renderBody()}else if(id==='fref'){S.f.ref=v;renderBody()}else if(id==='fsort'){S.f.sort=v;renderBody()}else if(id==='eRef'){prefs.ref=v.trim();savePrefs();toast('Name saved');beatNow()}});
$('#main').addEventListener('submit',e=>{e.preventDefault();const ev=curEv();if(!ev)return;if(!writable(ev))return toast('This event is view-only for you');
 if(e.target.id==='evForm'){ev.name=$('#eName').value.trim()||ev.name;ev.program=$('#eProg').value;ev.date=$('#eDate').value;const ns=$('#eSku').value.trim();if(ns!==ev.sku)ev.re=null;ev.sku=ns;ev.sample=false;persistEvent(ev);shellKey='';renderAll();toast('Event saved')}
 if(e.target.id==='ruleForm'){const code=$('#rcode').value.trim().toUpperCase().replace(/[<>\s]/g,'').slice(0,12),label=$('#rlabel').value.trim();if(!code)return;if(ruleMap(ev).has(code))return toast(`<${code}> is already in the list`);ev.customRules.push({code,label});persistEvent(ev);toast(`Added <${code}>`)}});
addEventListener('online',()=>{S.offline=false;renderSync()});addEventListener('offline',()=>{S.offline=true;renderSync()});

/* ---------- boot ---------- */
rebuildEvents();renderAll();
const giveUp=setTimeout(()=>{if(S.waitCloud){S.waitCloud=false;rebuildEvents();shellKey='';renderAll()}},10000);
function cloudReady(){if(S.answered.shared&&(S.answered.mine||!S.uid)&&S.waitCloud){S.waitCloud=false;clearTimeout(giveUp)}rebuildEvents();renderAll()}
function watchList(where,path){S.db.collection(path).onSnapshot(snap=>{const m=new Map();for(const d of snap.docs){const x=d.data();if(x&&x.kind==='event')m.set(d.id,cleanEvent(x,d.id,where))}
  for(const[id,e]of cloudEv[where])if(!m.has(id)&&wq.has(evDoc(e)))m.set(id,e);cloudEv[where]=m;if(!snap.metadata.fromCache)S.answered[where]=true;cloudReady()},()=>{S.answered[where]=true;cloudReady()})}
initFirebase();
(async()=>{const c=window.claude;if(!c||!c.use){if(!(roomsOn()&&prefs.curWhere==='room'))S.waitCloud=false;rebuildEvents();shellKey='';renderAll();return}
 try{const[db,user,dl]=await Promise.all([c.use('db'),c.use('user'),c.use('downloads')]);S.dl=dl||null;
  if(user){try{S.uid=await user.id()}catch(e){}try{if(await user.can('data.write')===false)S.canWrite=false}catch(e){}}
  if(db){S.db=db;watchList('shared','events');if(S.uid)watchList('mine','data/users/'+S.uid);S.boundKey=null;ensureBound()}else{S.waitCloud=false}
 }catch(e){S.waitCloud=false}
 rebuildEvents();shellKey='';renderAll()})();
}
